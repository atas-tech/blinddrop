<!DOCTYPE html>

<html class="light" lang="en"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>BlindDrop</title>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <!-- Google Fonts: Manrope & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@700;800&amp;display=swap" rel="stylesheet"/>

    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
</head>
<body class="font-body text-on-surface antialiased">
<!-- TopNavBar Shell -->
<header class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center px-8 py-3 bg-white/40 dark:bg-slate-900/40 backdrop-blur-xl rounded-full mt-6 mx-auto w-[90%] max-w-5xl border border-white/60 dark:border-slate-700/30 shadow-[0_20px_40px_rgba(30,41,59,0.06)] font-['Manrope'] tracking-tight">
<div class="flex items-center gap-2">
<span class="text-2xl font-black text-slate-900 dark:text-slate-50">BlindDrop</span>
</div>
<nav class="hidden md:flex items-center gap-8">
<a class="text-blue-700 dark:text-blue-300 font-bold hover:bg-white/60 dark:hover:bg-slate-800/60 transition-all px-3 py-1 rounded-full" href="#">Create</a>
<a class="text-slate-500 dark:text-slate-400 hover:bg-white/60 dark:hover:bg-slate-800/60 transition-all px-3 py-1 rounded-full" href="#">Security Audit</a>
<a class="text-slate-500 dark:text-slate-400 hover:bg-white/60 dark:hover:bg-slate-800/60 transition-all px-3 py-1 rounded-full" href="#">Tools</a>
</nav>
<div class="flex items-center">
<button class="p-2 text-blue-600 dark:text-blue-400 active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="lock">lock</span>
</button>
</div>
</header>
<main class="relative min-h-screen pt-32 pb-20 px-6 flex flex-col items-center justify-center">
<!-- Background Decorative Element -->
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary/10 blur-[120px] rounded-full -z-10"></div>
<div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-secondary-container/30 blur-[100px] rounded-full -z-10"></div>
<!-- Main Card Center -->
<div class="glass-panel w-full max-w-2xl p-8 md:p-12 rounded-xl shadow-[0_20px_60px_rgba(30,41,59,0.08)]">
<div class="flex flex-col items-center text-center mb-10">
<div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-primary/10 text-primary mb-4">
<span class="material-symbols-outlined text-3xl" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<h1 class="font-headline text-4xl md:text-5xl font-extrabold tracking-tight text-on-surface mb-2">BlindDrop</h1>
<p class="text-on-surface-variant font-medium text-lg">Share secrets that self-destruct</p>
</div>
<div class="space-y-8">
            <!-- Secret Input -->
            <div class="group" id="input-container">
                <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-3 ml-1">The Secret</label>
                <textarea id="secret-input" class="w-full min-h-[160px] bg-surface-container-lowest border-none rounded-sm p-6 text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/20 transition-all shadow-inner text-lg leading-relaxed" placeholder="Enter your secret... (password / API key)"></textarea>
                
                <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mt-6 mb-3 ml-1">Optional Passphrase</label>
                <input type="password" id="passphrase-input" class="w-full bg-surface-container-lowest border-none rounded-sm px-6 py-4 text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/20 transition-all shadow-inner text-lg" placeholder="Protect with an extra password..." />
            </div>

            <!-- TTL Selection -->
            <div id="ttl-container">
                <label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-4 ml-1">Expires after:</label>
                <div class="flex flex-wrap gap-3" id="ttl-buttons">
                    <button data-ttl="300" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-white/60 text-on-surface-variant border border-outline-variant/20 hover:bg-white transition-all">5m</button>
                    <button data-ttl="3600" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-primary text-on-primary shadow-lg shadow-primary/20 transition-all">1h</button>
                    <button data-ttl="86400" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-white/60 text-on-surface-variant border border-outline-variant/20 hover:bg-white transition-all">24h</button>
                    <button data-ttl="604800" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-white/60 text-on-surface-variant border border-outline-variant/20 hover:bg-white transition-all">7d</button>
                </div>
            </div>

            <!-- Turnstile Widget -->
            <div id="turnstile-container" class="mt-4"></div>

            <!-- Action Button -->
            <button id="action-btn" class="w-full py-5 rounded-lg bg-gradient-to-r from-primary to-primary-container text-white font-headline text-lg font-bold shadow-xl shadow-primary/25 hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                <span id="action-text">Create Secret link</span>
                <span class="material-symbols-outlined" data-icon="bolt" style="font-variation-settings: 'FILL' 1;">bolt</span>
            </button>
        </div>
</div>
<!-- Bottom Helper Row -->
<div class="mt-12 flex flex-col md:flex-row items-center justify-center gap-6 md:gap-16 w-full max-w-4xl px-4">
<div class="flex items-center gap-3 group">
<div class="flex-shrink-0 w-8 h-8 rounded-full bg-white/40 flex items-center justify-center border border-white/60 shadow-sm text-primary font-bold text-sm">1</div>
<p class="text-on-surface-variant text-sm font-medium tracking-tight">Encrypted in your browser</p>
</div>
<div class="flex items-center gap-3 group">
<div class="flex-shrink-0 w-8 h-8 rounded-full bg-white/40 flex items-center justify-center border border-white/60 shadow-sm text-primary font-bold text-sm">2</div>
<p class="text-on-surface-variant text-sm font-medium tracking-tight">Only ciphertext is stored</p>
</div>
<div class="flex items-center gap-3 group">
<div class="flex-shrink-0 w-8 h-8 rounded-full bg-white/40 flex items-center justify-center border border-white/60 shadow-sm text-primary font-bold text-sm">3</div>
<p class="text-on-surface-variant text-sm font-medium tracking-tight">Link works exactly once</p>
</div>
</div>
</main>
<!-- Footer Shell -->
<footer class="w-full py-12 flex flex-col md:flex-row justify-center items-center gap-8 bg-transparent text-xs font-medium font-['Inter'] uppercase tracking-widest text-slate-400 dark:text-slate-600">
<div class="text-slate-900 dark:text-slate-50 font-bold opacity-80">BlindDrop: End-to-End Encrypted Secrets</div>
<div class="flex items-center gap-8">
<a class="hover:text-blue-600 dark:hover:text-blue-400 transition-opacity opacity-80 hover:opacity-100" href="#">Privacy</a>
<a class="hover:text-blue-600 dark:hover:text-blue-400 transition-opacity opacity-80 hover:opacity-100" href="#">Security Audit</a>
<a class="hover:text-blue-600 dark:hover:text-blue-400 transition-opacity opacity-80 hover:opacity-100" href="#">Terms</a>
</div>
</footer>
<!-- Imagery Placeholder (Optional Background Texture) -->
<div class="fixed inset-0 -z-50 overflow-hidden pointer-events-none opacity-20">
<div class="absolute -top-[20%] -right-[10%] w-[60%] h-[60%]" data-alt="soft ethereal gradient sphere in light blue and soft lavender drifting in a clean white space"></div>
</div>
</body></html>
