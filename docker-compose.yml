version: '3.8'

services:
  api:
    build: .
    container_name: blinddrop_api
    ports:
      - "3001:3001"
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: blinddrop_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
