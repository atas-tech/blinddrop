# BlindDrop stores secrets only for their TTL. Do not persist encrypted
# envelopes, terminal tombstones, or rate-limit counters to disk.
save ""
appendonly no

# D5 default: reserve headroom for tombstones and limiter counters. The
# operator must size this for the deployment and alert before the ceiling.
maxmemory 256mb
maxmemory-policy noeviction

protected-mode yes
bind 0.0.0.0
